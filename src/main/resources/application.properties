# Application Configuration
spring.application.name=fraud-detection

# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/frauddb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Thread pool for async fraud detection
fraud.detection.thread-pool-size=5
fraud.detection.anomaly-threshold=0.65

# Logging
logging.level.com.frauddetection=INFO
logging.level.org.springframework.web=WARN

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
